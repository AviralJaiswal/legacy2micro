[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy2micro"
version = "0.1.0"
description = "Mainframe Modernization Suite: Legacy COBOL to Cloud-Native Microservices"
readme = "README.md"
authors = [
    { name = "Legacy2Micro Team" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
pythonpath = ["src"]
markers = [
    "asyncio: mark test as asyncio test",
]

[tool.setuptools.packages.find]
where = ["src"]
